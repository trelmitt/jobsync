services:
  app:
    # Build from this fork's source (partner + ventures code); the upstream
    # ghcr image does not contain it.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobsync_app
    ports:
      - "3737:3737"
    # Secrets (AUTH_SECRET, ENCRYPTION_KEY, PARTNER_SESSION_SECRET,
    # PARTNER_PIN_HASH, iMessage config) load literally from this gitignored
    # file — env_file is not interpolated, so the bcrypt hash's $ needs no escaping.
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - DATABASE_URL=file:/data/dev.db
      # NEXTAUTH_URL MUST become the public HTTPS origin (OpenShip) before exposure.
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3737}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      - TZ=${TZ:-America/Edmonton}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-}
    volumes:
      - ./jobsyncdb/data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3737"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
